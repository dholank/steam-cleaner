name: Safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated safety tests
        shell: ${{ matrix.shell }}
        run: ./tests/safety.tests.ps1
