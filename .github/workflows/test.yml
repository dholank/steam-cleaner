name: Safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell 5.1 safety tests
        shell: powershell
        run: ./tests/safety.tests.ps1
      - name: Run PowerShell 7 safety tests
        shell: pwsh
        run: ./tests/safety.tests.ps1
